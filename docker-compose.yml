services:
  booklet-api:
    build: .
    image: booklet-imposition-api:latest
    container_name: booklet-imposition-api
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。可用环境变量 HOST_PORT 覆盖宿主机端口
      - "${HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
